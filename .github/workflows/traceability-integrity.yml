name: Evidence tree integrity (not certification)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate tree without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Negative and positive manifest regression suite
        run: python -m unittest discover -s tests -p 'test_repository_manifest.py' -v
      - name: Verify every tracked file against the candidate manifest
        run: python tools/verify_repository_manifest.py .
