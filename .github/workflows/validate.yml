name: Validate Evidence & Baseline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        python -m unittest discover tests -v

    - name: Validate evidence object
      run: |
        python validators/validate_evidence.py evidence/local/EVID-EVT-0002.json

    - name: Simulate replay contract validation
      run: |
        python validators/validate_replay.py replay/replay-contract.json fixtures/S-001A/fixture.json
